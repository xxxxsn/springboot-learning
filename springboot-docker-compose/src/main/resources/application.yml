server:
  port: 8017

spring:
  application:
    name: springboot-docker-compose
  docker:
    compose:
      # 相对路径仅作占位；运行时由 ComposeFileEnvironmentPostProcessor 覆盖为绝对路径
      file: compose.yaml
      enabled: true
      lifecycle-management: start-and-stop
      readiness:
        timeout: 60s

logging:
  level:
    org.springframework.boot.docker.compose: INFO
